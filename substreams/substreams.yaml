specVersion: v0.1.0
package:
  name: polaris_music_substreams
  version: v0.1.0
  url: https://github.com/PolarisMusic/polaris-music
  doc: |
    Substreams module for indexing the Polaris Music Registry on Antelope blockchains.

    This module extracts all events from the Polaris smart contract including:
    - Event anchoring (PUT)
    - Attestations (ATTEST)
    - Voting (VOTE)
    - Finalization (FINALIZE)
    - Staking (STAKE/UNSTAKE)
    - Likes (LIKE/UNLIKE)
    - Respect updates (UPDATE_RESPECT)

imports:
  # Pinax distributes .spkg builds via spkg.io — their GitHub Releases page
  # only ships source archives (v0.4+). This URL matches the fallback
  # documented in docker-compose.yml.
  antelope: https://spkg.io/pinax-network/antelope-common-v0.4.0.spkg

protobuf:
  files:
    - proto/polaris.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: target/wasm32-unknown-unknown/release/polaris_substreams.wasm

modules:
  # Extract all Polaris events from blocks
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.antelope.type.v1.Block
    output:
      type: proto:polaris.v1.Events
    doc: |
      Extracts all Polaris Music Registry events from Antelope blocks.

      Parameters:
      - contract_account: The account name of the Polaris contract (default: "polaris")

      Example:
        substreams run -e eos.firehose.pinax.network:443 \
          map_events -p map_events="polaris" \
          --start-block 100000000 --stop-block +1000

  # Aggregate statistics from events
  - name: store_stats
    kind: store
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_events
    doc: |
      Stores aggregate statistics about Polaris events.

      Keys:
      - total_events: Total number of events processed
      - total_puts: Total number of PUT events
      - total_votes: Total number of VOTE events
      - total_stakes: Total number of STAKE events
      - total_likes: Total number of LIKE events

  # Track per-account activity
  - name: store_account_activity
    kind: store
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_events
    doc: |
      Stores per-account activity metrics.

      Keys (per account):
      - account:{name}:events: Number of events submitted
      - account:{name}:last_block: Last block with activity

  # Output aggregated statistics
  - name: map_stats
    kind: map
    inputs:
      - store: store_stats
        mode: get
    output:
      type: proto:polaris.v1.Stats
    doc: |
      Outputs aggregated statistics about Polaris events.

      Example:
        substreams run map_stats --start-block 100000000 --stop-block +1000

  # Extract anchored events for chain ingestion (T5 primary output)
  - name: map_anchored_events
    kind: map
    # Consume the foundational `filtered_actions` module rather than raw blocks.
    #
    # A blockFilter over `source: Block` was measurably not enough: empty
    # 10,000-block windows still cost 3.8 MiB against 4.3 MiB unfiltered, and a
    # second pass over the same range showed `0 already cached` — the block data
    # crosses to the module either way. Pinax's own guidance is that the
    # `filtered-*` modules are the ones that "skip large chunks of empty blocks",
    # while `index-*` and `all-*` are utility modules not meant to be consumed
    # directly. What arrives here is now extracted ActionTraces, not blocks.
    #
    # filtered_actions takes its query from its own params, which is why the
    # sink passes `antelope:filtered_actions=code:<account>` alongside this
    # module's params. map_anchored_events reads the account back out of that
    # `code:` term (contract_account_from_params in src/lib.rs) rather than the
    # manifest naming it a second time, where it would drift from
    # CONTRACT_ACCOUNT.
    inputs:
      - params: string
      - map: antelope:filtered_actions
    output:
      type: proto:polaris.v1.AnchoredEvents
    doc: |
      Extracts anchored events with complete blockchain provenance for chain ingestion.
      This is the primary output for the T5 ingestion pipeline.

      Each anchored event includes:
      - Event hash (SHA256 of payload)
      - Raw event payload (JSON)
      - Block metadata (number, ID, timestamp)
      - Transaction metadata (ID, action ordinal)
      - Source identifier

      Example:
        substreams run -e eos.firehose.pinax.network:443 \
          map_anchored_events -p map_anchored_events="polaris" \
          --start-block 100000000 --stop-block +1000

params:
  map_events: polaris
  # Query form, shared with the filtered_actions module below. A bare account
  # name is still parsed correctly by map_anchored_events, so an older override
  # keeps working.
  map_anchored_events: code:polaris
  antelope:filtered_actions: code:polaris

# Network configuration
# Options: eos-mainnet | jungle4-testnet
# Use jungle4-testnet for development and testing
# Override with CLI: substreams run -e jungle4.substreams.pinax.network:443 ...
network: jungle4-testnet

# NOTE: no `sink:` block here on purpose.
#
# Ingestion is done by sink/http-sink.mjs, which spawns
# `substreams run <package> <module> --output jsonl` and posts each
# decoded line to the backend itself. It never reads a manifest sink
# config, so declaring one bought us nothing.
#
# The old block declared type sf.substreams.sink.files.v1.Files (the
# substreams-sink-files config). Older CLIs ignored it; substreams
# v1.21 resolves sink types against the package's bundled protobuf
# descriptors at manifest-load time and hard-fails, because we never
# import the sink-files package that defines that message.
