apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-config
  namespace: polaris
data:
  # Blockchain Configuration
  CHAIN_ID: "aca376f206b8fc25a6ed44dbdc66547c36c6c33e3a119ffbeaef943642f0e906"
  RPC_URL: "https://eos.greymass.com"
  CONTRACT_ACCOUNT: "<your_contract_account>"  # Replace with deployed account (e.g., polarismusic)

  # Service URLs (internal cluster DNS)
  GRAPH_URI: "bolt://neo4j:7687"
  GRAPH_USER: "neo4j"
  IPFS_URL: "http://ipfs:5001"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "polaris-events"
  S3_REGION: "us-east-1"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # API Configuration
  PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://polaris.music"

  # Processor Configuration
  START_BLOCK: "0"
  BATCH_SIZE: "100"
  POLL_INTERVAL: "5000"

  # Neo4j Configuration
  # graph-data-science is not called anywhere in backend/src; dropped rather
  # than carried to mainnet.
  NEO4J_PLUGINS: '["apoc"]'
  # Still dbms.* in Neo4j 5 — the security namespace did not move.
  NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
  # server.*, not dbms.*. The statefulset runs neo4j:5.15-community, which
  # ignores the Neo4j 4 spelling outright — on the testnet VPS that meant no
  # cap was applied and the OOM killer took Neo4j out eleven times in nine
  # days. Sizes here assume a node with room for them; check them against the
  # pod's actual limits before mainnet.
  NEO4J_server_memory_heap_initial__size: "1G"
  NEO4J_server_memory_heap_max__size: "4G"
  NEO4J_server_memory_pagecache_size: "2G"

  # IPFS Configuration
  IPFS_PROFILE: "server"
