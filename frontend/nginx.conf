# Serving config for the built frontend.
#
# Lives in the image rather than in the reverse proxy so the routing travels
# with the frontend wherever it is served, instead of depending on whatever
# sits in front of it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Extensionless URLs: /submit serves submit.html.
    #
    # Falls through to =404 rather than /index.html. This is a multi-page app,
    # not an SPA — a mistyped path should fail visibly instead of silently
    # rendering the graph and looking like a broken page.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build assets are immutable; the HTML that references them is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /submit.html {
        add_header Cache-Control "no-cache";
    }
}
