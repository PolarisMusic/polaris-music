<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- embed-cdn.spotifycdn.com is required even though no source file
         mentions it: https://open.spotify.com/embed/iframe-api/v1 is only a
         loader, and it fetches the actual iFrame API implementation from that
         CDN. Without it the script is blocked, onSpotifyIframeApiReady never
         fires, and the MiniPlayer's play button does nothing. Do not remove it
         as unused. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://open.spotify.com https://embed-cdn.spotifycdn.com; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3001 http://localhost:3000 https://api.polaris.mu https://eos.greymass.com https://jungle4.greymass.com https://eos.eosusa.io https://*.anchor.link wss://*.anchor.link https://cb.anchor.link wss://cb.anchor.link https://open.spotify.com https://embed-cdn.spotifycdn.com; img-src 'self' data: https:; media-src 'self' https: blob:; frame-src https://*.anchor.link https://open.spotify.com;">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Polaris Music Registry - Graph Visualization</title>

    <!-- JIT Library (local copy) -->
    <!-- Vite copies the CONTENTS of public/ to the dist root, so the built
     path is /lib/jit.js. The ./public/ prefix resolved only under the
     dev server, which also serves the project directory. -->
    <script src="./lib/jit.js"></script>

    <!-- Visualization Styles -->
    <link rel="stylesheet" href="./src/visualization/visualization.css">
</head>
<body>
    <!-- Top Bar -->
    <div id="top-bar">
        <div class="top-bar-left">
            <div class="logo"><span class="logo-full">Polaris Music Registry</span><span class="logo-short">Polaris</span></div>
        </div>
        <div class="top-bar-center">
            <div id="graph-search-container"></div>
        </div>
        <div class="top-bar-right">
            <div class="user-info">
                <span id="user-account">Not logged in</span>
                <button id="connect-wallet" class="btn-wallet">Log In</button>
            </div>
            <div class="stats">
                <span class="stat-item stat-clickable" id="favorites-toggle">
                    <span class="icon">⭐</span>
                    <span id="favorites-count">0</span> Favorites
                </span>
                <span class="stat-item stat-clickable" id="curate-toggle">
                    <span class="icon">🗳</span>
                    Curate
                </span>
                <span class="stat-item stat-clickable" id="history-toggle">
                    <span class="icon">❄️</span>
                    <span id="history-count">0</span> History
                </span>
            </div>
        </div>
    </div>

    <!-- History Panel (hidden by default) -->
    <div id="history-panel" style="display: none;">
        <div class="history-header">
            <h3>History</h3>
            <div class="history-actions">
                <button id="history-clear" class="btn-history">Clear</button>
                <button id="history-close" class="btn-close">&times;</button>
            </div>
        </div>
        <ul id="history-list"></ul>
    </div>

    <!-- Favorites Panel (hidden by default) -->
    <div id="favorites-panel" style="display: none;">
        <div class="history-header">
            <h3>Favorites</h3>
            <div class="history-actions">
                <button id="favorites-close" class="btn-close">&times;</button>
            </div>
        </div>
        <ul id="favorites-list"></ul>
    </div>

    <!-- Curate Panel (hidden by default) - split list/detail layout -->
    <div id="curate-panel" style="display: none;">
        <div class="curate-feed-column">
            <div class="history-header">
                <h3>Curate</h3>
                <div class="history-actions">
                    <button id="curate-close" class="btn-close">&times;</button>
                </div>
            </div>
            <div id="curate-list" class="curate-list"></div>
        </div>
        <div class="curate-detail-column" id="curate-detail">
            <div class="curate-detail-empty">
                <p>Select an operation to inspect</p>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div id="main-container">
        <!-- Visualization Canvas -->
        <div id="viz-container">
            <div id="infovis"></div>

            <!-- Release orbit overlay (positioned above canvas) -->
            <div id="release-orbit-overlay"></div>
        </div>

        <!-- Info Viewer Panel -->
        <!-- Dismisses the mobile info sheet when tapped. Must be inside
             #main-container: that element is position:fixed and so creates a
             stacking context, and a backdrop outside it would paint above the
             sheet no matter how high the sheet's z-index. Keeping it here also
             leaves the top and bottom bars usable while the sheet is open. -->
        <div id="info-backdrop" class="info-backdrop" hidden></div>

        <div id="info-viewer">
            <!-- Drag affordance for the mobile bottom sheet; hidden on desktop. -->
            <div id="info-sheet-handle" class="info-sheet-handle" aria-hidden="true"></div>
            <div class="info-header">
                <h2 id="info-title">Select a node</h2>
                <button id="node-favorite" class="btn-favorite" title="Like">☆</button>
                <button id="info-close" class="btn-info-close" title="Close" aria-label="Close details">✕</button>
            </div>

            <div id="info-scroll" class="info-scroll">
                <div id="info-content" class="info-content">
                    <p class="placeholder">Click on a Group or Person to see details</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Mini Player (persistent bottom bar) -->
    <div id="mini-player-container"></div>

    <!-- Bottom Bar -->
    <div id="bottom-bar">
        <!-- On phones the four actions below wrap to three lines each, so they
             collapse behind this toggle instead. Hidden on desktop. -->
        <button class="btn-action btn-actions-toggle" id="actions-toggle"
                aria-expanded="false" aria-controls="bottom-bar">Menu ▾</button>
        <button class="btn-action" id="submit-project">Submit a Project</button>
        <a href="https://ursapolarisrecords.com/polaris" class="btn-action" target="_blank">Info / Contact</a>
        <a href="https://ursapolarisrecords.com/album-artwork-1" class="btn-action" target="_blank">Merch / Albums</a>
        <button class="btn-action" id="help">Help</button>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading graph data...</p>
    </div>

    <!-- Scripts -->
    <script type="module" src="./src/visualization/colorPalette.js"></script>
    <script type="module" src="./src/visualization/graphApi.js"></script>
    <script type="module" src="./src/visualization/PathTracker.js"></script>
    <script type="module" src="./src/visualization/LikeManager.js"></script>
    <script type="module" src="./src/visualization/MiniPlayer.js"></script>
    <script type="module" src="./src/visualization/MusicGraph.js"></script>
    <script type="module" src="./src/wallet/WalletManager.js"></script>
    <script type="module">
        import { MusicGraph } from './src/visualization/MusicGraph.js';
        import { WalletManager } from './src/wallet/WalletManager.js';
        import { NodeSearchBox } from './src/components/NodeSearchBox.js';
        import { MiniPlayer } from './src/visualization/MiniPlayer.js';

        // Initialize wallet manager
        const walletManager = new WalletManager();
        window.walletManager = walletManager; // For debugging

        // UI elements
        const userAccountEl = document.getElementById('user-account');
        const connectWalletBtn = document.getElementById('connect-wallet');

        /**
         * Update UI based on wallet connection status
         */
        function updateWalletUI(accountInfo) {
            if (accountInfo) {
                userAccountEl.textContent = accountInfo.accountName;
                userAccountEl.style.color = '#4CAF50';
                connectWalletBtn.textContent = 'Log Out';
            } else {
                userAccountEl.textContent = 'Not logged in';
                userAccountEl.style.color = '';
                connectWalletBtn.textContent = 'Log In';
            }
        }

        /**
         * Handle wallet connection/disconnection
         */
        async function handleWalletButtonClick() {
            if (walletManager.isConnected()) {
                // Disconnect wallet
                await walletManager.disconnect();
                updateWalletUI(null);
            } else {
                // Connect wallet
                try {
                    const accountInfo = await walletManager.connect();
                    updateWalletUI(accountInfo);
                } catch (error) {
                    console.error('Failed to connect wallet:', error);
                    alert('Failed to connect wallet. Please try again.');
                }
            }
        }

        // Initialize visualization when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            // Pass walletManager to enable like functionality
            const graph = new MusicGraph('infovis', walletManager);
            window.musicGraph = graph; // For debugging

            // Initialize mini-player
            const playerContainer = document.getElementById('mini-player-container');
            if (playerContainer) {
                const miniPlayer = new MiniPlayer({
                    container: playerContainer,
                    api: graph.api
                });
                graph.miniPlayer = miniPlayer;
            }

            // Search bar in top bar
            const searchContainer = document.getElementById('graph-search-container');
            if (searchContainer) {
                new NodeSearchBox({
                    container: searchContainer,
                    placeholder: 'Search nodes...',
                    onSelect: (result) => {
                        graph.navigateToSearchResult(result);
                    }
                });
            }

            // Load initial graph data from backend
            // Chrome listeners go on BEFORE the data load below. Anything
            // registered after that await never attaches if the API is
            // unreachable, which leaves the UI's buttons dead rather than
            // merely showing an empty graph.
            const actionsToggle = document.getElementById('actions-toggle');
            const bottomBar = document.getElementById('bottom-bar');
            if (actionsToggle && bottomBar) {
                actionsToggle.addEventListener('click', () => {
                    const open = bottomBar.classList.toggle('actions-open');
                    actionsToggle.setAttribute('aria-expanded', String(open));
                    actionsToggle.textContent = open ? 'Menu ▴' : 'Menu ▾';
                });
            }

            await graph.loader.loadGraphData();

            // Try to restore wallet session
            try {
                const accountInfo = await walletManager.restore();
                if (accountInfo) {
                    updateWalletUI(accountInfo);
                }
            } catch (error) {
                console.error('Failed to restore wallet session:', error);
            }

            // Log In button
            if (connectWalletBtn) {
                connectWalletBtn.addEventListener('click', handleWalletButtonClick);
            }

            // Submit a Project button
            const submitBtn = document.getElementById('submit-project');
            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    if (!walletManager.isConnected()) {
                        alert('Please connect your wallet first before submitting a project.');
                        return;
                    }
                    // Navigate to submission form
                    window.location.href = '/submit';
                });
            }

            // Help button - link to Reddit community
            const helpBtn = document.getElementById('help');
            if (helpBtn) {
                helpBtn.addEventListener('click', () => {
                    window.open('https://www.reddit.com/r/polarismusic/', '_blank');
                });
            }

            // History panel toggle
            const historyToggle = document.getElementById('history-toggle');
            if (historyToggle) {
                historyToggle.addEventListener('click', () => {
                    graph.toggleHistoryPanel();
                });
            }

            // History panel close button
            const historyClose = document.getElementById('history-close');
            if (historyClose) {
                historyClose.addEventListener('click', () => {
                    graph.toggleHistoryPanel();
                });
            }

            // History panel clear button
            const historyClear = document.getElementById('history-clear');
            if (historyClear) {
                historyClear.addEventListener('click', () => {
                    graph.clearHistory();
                });
            }

            // Star favorite button in info panel
            const nodeFavBtn = document.getElementById('node-favorite');
            if (nodeFavBtn) {
                nodeFavBtn.addEventListener('click', () => graph.likeSelectedNode());
            }

            // Curate panel toggle
            const curateToggle = document.getElementById('curate-toggle');
            if (curateToggle) {
                curateToggle.addEventListener('click', () => graph.toggleCuratePanel());
            }
            const curateClose = document.getElementById('curate-close');
            if (curateClose) {
                curateClose.addEventListener('click', () => graph.toggleCuratePanel());
            }

            // Favorites panel toggle
            const favoritesToggle = document.getElementById('favorites-toggle');
            if (favoritesToggle) {
                favoritesToggle.addEventListener('click', () => graph.favorites.toggleFavoritesPanel());
            }
            const favoritesClose = document.getElementById('favorites-close');
            if (favoritesClose) {
                favoritesClose.addEventListener('click', () => graph.favorites.toggleFavoritesPanel());
            }

            // Listen for wallet events
            walletManager.on('onConnect', async (accountInfo) => {
                console.log('Wallet connected event:', accountInfo);
                await graph.favorites.refreshFavoritesFromChain();
                await graph.updateFavoriteButton();
            });

            walletManager.on('onDisconnect', () => {
                console.log('Wallet disconnected event');
                graph.favorites.chainFavorites = new Set();
                graph.favorites.chainFavoritesLoaded = false;
                graph.favorites.updateFavoritesCount();
                graph.updateFavoriteButton();
            });

            walletManager.on('onError', (error) => {
                console.error('Wallet error event:', error);
            });
        });
    </script>
</body>
</html>
